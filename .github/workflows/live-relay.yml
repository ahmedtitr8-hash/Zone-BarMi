name: Live Stream Relay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          cat > .env << EOF
          PORT=3000
          API_KEY=${{ secrets.API_KEY }}
          CLUB1_NAME=${{ secrets.CLUB1_NAME }}
          CLUB2_NAME=${{ secrets.CLUB2_NAME }}
          SIGNED_URL_EXPIRY_DAYS=7
          MAX_RECORDING_HOURS=5
          MAX_CONCURRENT_RECORDINGS=2
          TEMP_DIR=./temp
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATUS_INTERVAL_MINUTES=5
          TELEGRAM_REMINDER_MINUTES_BEFORE=10
          GH_PAT=${{ secrets.GH_PAT }}
          IA_ACCESS_KEY=${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY=${{ secrets.IA_SECRET_KEY }}
          SEAL_SECRET=${{ secrets.SEAL_SECRET }}
          EOF

      - name: Start server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: sleep 5

      # معلومات فقط (ما تغيّر شيء): وين جهاز الأكشن، وكم ياخذ الاتصال بالمصدر منه. تطلع بسجل التشغيل، ولو فشلت ما توقف التشغيل.
      - name: Where is this runner
        continue-on-error: true
        run: |
          echo "== موقع الجهاز =="
          curl -s --max-time 8 https://ipinfo.io/json > /tmp/ipinfo.json || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/ipinfo.json'))
              print('المدينة:', d.get('city'), '| المنطقة:', d.get('region'), '| الدولة:', d.get('country'), '| المزود:', d.get('org'))
          except Exception:
              print('ما قدرت أحدد الموقع')
          PY
          echo "== أقرب مركز Cloudflare =="
          curl -s --max-time 8 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(colo|loc)=' || true
          echo "== الاتصال بالمصدر من هذا الجهاز (3 قياسات) =="
          for i in 1 2 3; do
            curl -s -o /dev/null --max-time 10 -w "اتصال: %{time_connect}s | TLS: %{time_appconnect}s | أول بايت: %{time_starttransfer}s | رمز: %{http_code}\n" https://smarter.majedcss.site/ || echo "فشل القياس $i"
          done

      - name: Download cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare quick tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:3000 > cf.log 2>&1 &
          echo $! > cf.pid

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log | head -n1)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "$URL" > tunnel_url.txt
              echo "Found: $URL"
              break
            fi
            sleep 2
          done

      - name: Notify Telegram
        run: |
          MSG=$'✅ الأكشن شغّال الآن.\n\n🌐 لوحة التحكم الدائمة (استخدم هذي):\nhttps://ahmedtitr8-hash.github.io/Zone-BarMi/\n\nرابط النفق المؤقت (للمرجع فقط): '"${{ env.TUNNEL_URL }}"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG"

      - name: Publish panel URL to GitHub Pages
        run: |
          mkdir -p docs
          cat > docs/current-stream.json << EOF
          {
            "panelUrl": "${{ env.TUNNEL_URL }}",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/current-stream.json
          git commit -m "تحديث رابط الجلسة الحالية [skip ci]" || echo "لا فيه تغيير للحفظ"
          git push

      - name: Keep session alive
        run: |
          while true; do
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died - exiting keep-alive loop."
              break
            fi
            sleep 60
          done
