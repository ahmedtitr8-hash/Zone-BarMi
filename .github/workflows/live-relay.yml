name: Live Stream Relay

on:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          cat > .env << EOF
          PORT=3000
          API_KEY=${{ secrets.API_KEY }}
          CLUB1_NAME=${{ secrets.CLUB1_NAME }}
          CLUB2_NAME=${{ secrets.CLUB2_NAME }}
          B2_KEY_ID=${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY=${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME=${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT=${{ secrets.B2_ENDPOINT }}
          B2_REGION=${{ secrets.B2_REGION }}
          SIGNED_URL_EXPIRY_DAYS=7
          MAX_RECORDING_HOURS=5
          MAX_CONCURRENT_RECORDINGS=2
          B2_QUOTA_GB=10
          TEMP_DIR=./temp
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATUS_INTERVAL_MINUTES=5
          TELEGRAM_REMINDER_MINUTES_BEFORE=10
          TELEGRAM_CHANNEL_ID=${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_USERNAME=${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          TELEGRAM_LOCAL_API_URL=http://localhost:8081
          EOF

      - name: Start local Telegram Bot API server
        # يشتغل هالسيرفر طول عمر المهمة، جوا نفس الجهاز — يرفع حد رفع الفيديو
        # من 50 ميجا (الافتراضي) لـ 2GB. بدون هالخطوة، رفع أي مباراة كاملة يفشل.
        # مهم: هذي الحزمة تُضبط عن طريق متغيرات بيئة (-e) فقط، مو أوامر CLI.
        run: |
          docker run -d --name tg-local-api --network host \
            -e TELEGRAM_API_ID=${{ secrets.TG_API_ID }} \
            -e TELEGRAM_API_HASH=${{ secrets.TG_API_HASH }} \
            -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          # ننتظر لين يصير السيرفر جاهز فعليًا يستقبل طلبات قبل ما نكمل
          READY=0
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://localhost:8081"; then
              echo "Local Telegram Bot API server is up."
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "::error::Local Telegram Bot API server did not start — check TG_API_ID/TG_API_HASH secrets."
            docker logs tg-local-api || true
            exit 1
          fi

      - name: Start server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: sleep 5

      - name: Download cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare quick tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:3000 > cf.log 2>&1 &
          echo $! > cf.pid

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log | head -n1)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "Found: $URL"
              break
            fi
            sleep 2
          done

      - name: Notify Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="رابط البث الجاهز الآن: ${{ env.TUNNEL_URL }}"

      - name: Keep session alive
        run: |
          while true; do
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died - exiting keep-alive loop."
              break
            fi
            sleep 60
          done
