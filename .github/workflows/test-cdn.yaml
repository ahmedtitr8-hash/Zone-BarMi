name: Test CDN Reach

# اختبار فقط — يجرّب رابط المصدر من جهاز GitHub عبر كل أماكن الطلب (مباشر + الدول) ويطبع أيها يشتغل وأيها يختاره الريلاي.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الـ MPD الكامل'
        required: true
      ref:
        description: 'Referer للمصدر (اختياري)'
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        env:
          URL_TEST: ${{ inputs.url }}
          REF: ${{ inputs.ref }}
          HOP_KEY: ${{ secrets.HOP_KEY }}
          EGRESS_HOPS: ${{ secrets.EGRESS_HOPS }}
        run: |
          echo "::add-mask::$URL_TEST"
          node test-egress.js
