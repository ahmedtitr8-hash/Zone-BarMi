<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إعادة البث</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{color-scheme: dark;}
  body{background:#0b0b0b;color:#eee;font-family:sans-serif;margin:0;padding:0 12px 40px}
  .topbar{position:sticky;top:0;background:#0b0b0b;padding:12px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222;z-index:5}
  h2{margin:0;font-size:18px}
  #badge{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:bold;white-space:nowrap}
  .badge-on{background:#1b5e20;color:#a5d6a7}
  .badge-off{background:#3a1a1a;color:#ef9a9a}
  .badge-unknown{background:#333;color:#aaa}

  .box{max-width:600px;margin:24px auto;background:#141414;border:1px solid #222;border-radius:10px;padding:16px}
  label{display:block;font-size:13px;color:#aaa;margin:12px 0 6px}
  input{width:100%;box-sizing:border-box;padding:10px;border-radius:6px;border:1px solid #333;background:#0e0e0e;color:#eee;font-size:14px}
  button{background:#e53935;color:#fff;border:0;padding:12px 20px;border-radius:6px;font-size:15px;cursor:pointer;margin-top:16px;width:100%}
  button.secondary{background:#333}
  #result{max-width:600px;margin:16px auto;padding:14px;border-radius:8px;background:#0e2b13;border:1px solid #1b5e20;display:none;word-break:break-all;font-size:13px}
  #result.err{background:#2b0e0e;border-color:#5e1b1b}
  #resultLink{color:#a5d6a7;display:block;margin:8px 0}
  #copyBtn{background:#1e3a5c;margin-top:8px}
  .hint{font-size:12px;color:#777;margin-top:6px}
</style>
</head>
<body>

<div class="topbar">
  <h2>إعادة البث</h2>
  <span id="badge" class="badge-unknown">جاري التحقق...</span>
</div>

<div class="box">
  <label>رابط المصدر (أي نوع: m3u8, ts, Xtream...)</label>
  <input id="sourceUrl" placeholder="https://...">

  <label>مفتاح API (يُحفظ بمتصفحك بس، ما يترفع لأي مكان)</label>
  <input id="apiKey" type="password" placeholder="نفس API_KEY المضبوط بسر GitHub">

  <button onclick="startRelay()">▶ بث</button>
  <button class="secondary" onclick="stopRelay()">⏹ إيقاف</button>
  <div class="hint">لازم الأكشن يكون شغّال أول (شغّله من تبويب Actions بـGitHub وانتظر شوي).</div>
</div>

<div id="result"></div>

<script>
const OWNER = 'ahmedtitr8-hash';
const REPO  = 'Zone-BarMi';
const WORKFLOW_FILE = 'live-relay.yml';
const CLUB = 'club1'; // مثبّت داخليًا — ما يظهر بالواجهة، مو مهم لك تشوفه

const badge = document.getElementById('badge');
const resultEl = document.getElementById('result');
const apiKeyInput = document.getElementById('apiKey');

// حفظ مفتاح الـ API بمتصفحك بس (مو بالكود المرفوع) عشان ما تكتبه كل مرة
apiKeyInput.value = localStorage.getItem('zbm_api_key') || '';
apiKeyInput.addEventListener('change', () => localStorage.setItem('zbm_api_key', apiKeyInput.value));

async function checkActionStatus(){
  try{
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/runs?status=in_progress&per_page=5`);
    if(!res.ok) throw new Error('bad-status');
    const data = await res.json();
    const running = (data.workflow_runs || []).some(r => r.path.endsWith(WORKFLOW_FILE));
    badge.textContent = running ? '🔴 الأكشن شغّال الآن' : '⚪ ما فيه أكشن شغّال حالياً';
    badge.className = running ? 'badge-on' : 'badge-off';
  }catch(e){
    badge.textContent = '⚠️ تعذّر التحقق';
    badge.className = 'badge-unknown';
  }
}

async function getPanelUrl(){
  const res = await fetch('./current-stream.json?_=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('الأكشن مو شغّال، أو لسا ما جهز النفق. شغّله وانتظر دقيقة.');
  const data = await res.json();
  const ageMinutes = (Date.now() - new Date(data.startedAt).getTime()) / 60000;
  if (ageMinutes > 360) throw new Error('آخر جلسة قديمة، شغّل الأكشن من جديد.');
  return data.panelUrl;
}

function showResult(ok, text, link){
  resultEl.style.display = 'block';
  resultEl.className = ok ? '' : 'err';
  resultEl.innerHTML = text + (link ? `<span id="resultLink">${link}</span><button id="copyBtn" onclick="navigator.clipboard.writeText('${link}')">نسخ الرابط</button>` : '');
}

async function startRelay(){
  const url = document.getElementById('sourceUrl').value.trim();
  const key = apiKeyInput.value.trim();
  if (!url) { showResult(false, 'حط رابط المصدر أول.'); return; }
  if (!key) { showResult(false, 'حط مفتاح الـ API أول.'); return; }

  showResult(true, 'جاري البحث عن الأكشن الشغّال...');
  try{
    const panelUrl = await getPanelUrl();
    const form = new FormData();
    form.append('club', CLUB);
    form.append('url', url);

    const res = await fetch(`${panelUrl}/api/live/start`, {
      method: 'POST',
      headers: { 'x-api-key': key },
      body: form,
    });
    const data = await res.json();
    if (!res.ok){ showResult(false, 'فشل: ' + (data.error || res.status)); return; }

    const outputLink = panelUrl + data.hlsUrl;
    showResult(true, '✅ اشتغل! رابط الإخراج:', outputLink);
  }catch(e){
    showResult(false, e.message || 'صار خطأ.');
  }
}

async function stopRelay(){
  const key = apiKeyInput.value.trim();
  if (!key) { showResult(false, 'حط مفتاح الـ API أول.'); return; }
  try{
    const panelUrl = await getPanelUrl();
    const res = await fetch(`${panelUrl}/api/live/stop`, {
      method: 'POST',
      headers: { 'x-api-key': key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ club: CLUB }),
    });
    const data = await res.json();
    showResult(res.ok, res.ok ? 'تم الإيقاف.' : ('فشل: ' + (data.error || res.status)));
  }catch(e){
    showResult(false, e.message || 'صار خطأ.');
  }
}

checkActionStatus();
setInterval(checkActionStatus, 20000);
</script>
</body>
</html>
